[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassini-upyp"
version = "1.3.2"
description = "Cassini UVIS Python Package"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [{ name = "Nathan Le Guennic" }]

dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.13.0",
  "tqdm>=4.65.0",
  "spiceypy>=6.0.0",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8.4",
  "pillow>=9.3.0",
]

qt = [
  "PyQt6>=6.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cassini_upyp*"]

[tool.setuptools.package-data]
cassini_upyp = ["py.typed"]