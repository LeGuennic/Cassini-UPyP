# Environment / paths configuration for Cassini-UPyP
# --------------------------------------------------

[paths]

calibration_dir = '/path/to/folder/calibration_files/'
star_file       = '/path/to/file/stars.npy'

# SPICE kernels folder
kernels_dir = '/path/to/folder/spice_kernels'

# Path to IK kernel - cas_uvis_v07.ti
ik_path = '/path/to/file/cas_uvis_v07.ti'

# Path to LSK kernel - naif0012.tls
lsk_path = '/path/to/file/naif0012.tls'

# Path to PCK kernel - pck00010.tpc
pck_path = '/path/to/file/pck00010.tpc'